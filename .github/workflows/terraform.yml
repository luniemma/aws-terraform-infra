name: Terraform

# ──────────────────────────────────────────────────────────────────────────────
# Single workspace: `platform` (the shared EKS cluster).
#
# Triggers
#   - PR to main         → validate + plan (comment on PR) against platform
#   - Push to main       → validate + plan only — no auto-apply on the cluster stack
#   - Schedule (nightly) → validate + plan only (drift detection)
#   - Manual dispatch    → action = plan|apply|destroy; apply requires approval
#                          on the `platform` GitHub Environment.
# ──────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    # 06:00 UTC = 00:00 CST (winter) / 01:00 CDT (summer). GitHub cron is UTC only and does not honour DST.
    - cron: "0 6 * * *"
  pull_request:
    branches: [main, master]
    paths: &tf-paths
      - "**.tf"
      - "**.tfvars"
      - "environments/**"
      - ".github/workflows/terraform.yml"
      - ".github/actions/terraform-deploy/**"
  push:
    branches: [main, master]
    paths: *tf-paths
  workflow_dispatch:
    inputs:
      action:
        description: plan / apply / destroy (env is always 'platform')
        required: true
        default: plan
        type: choice
        options: [plan, apply, destroy]
      confirmation:
        description: 'Required for destroy: type "destroy platform" exactly'
        required: false
        default: ''

# Deny-by-default. Each job re-requests exactly what it needs.
permissions: {}

# Serialise applies per environment so two pushes never fight for the state lock.
# Plans still run in parallel because the group is different.
concurrency:
  group: tf-platform-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || (inputs.action || 'plan') }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "0"
  TF_CLI_ARGS: "-no-color"
  # Override by setting repo variable TERRAFORM_VERSION.
  TERRAFORM_VERSION: ${{ vars.TERRAFORM_VERSION || '1.9.8' }}
  RUNNER_IMAGE:      ${{ vars.RUNNER_IMAGE    || 'ubuntu-latest' }}

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Resolve the target environment once and expose it to downstream jobs.
  # ────────────────────────────────────────────────────────────────────────────
  config:
    name: Resolve config
    runs-on: ${{ vars.RUNNER_IMAGE || 'ubuntu-latest' }}
    timeout-minutes: 2
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      action:      ${{ steps.env.outputs.action }}
      tfvars:      ${{ steps.env.outputs.tfvars }}
      run-apply:   ${{ steps.env.outputs.run-apply }}
    steps:
      - id: env
        shell: bash
        env:
          EVENT:              ${{ github.event_name }}
          INPUT_ACTION:       ${{ inputs.action }}
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          # Single workspace: platform. Push/PR/schedule are plan-only — apply
          # only via workflow_dispatch (so the `platform` GitHub Environment's
          # required reviewers always gate cluster changes).
          env="platform"
          case "${EVENT}" in
            pull_request)      action="plan" ;;
            push)              action="plan" ;;
            schedule)          action="plan" ;;
            workflow_dispatch) action="${INPUT_ACTION}" ;;
            *) echo "::error::Unsupported event: ${EVENT}"; exit 1 ;;
          esac

          # Destroy requires a typed confirmation matching "destroy platform" exactly.
          if [ "${action}" = "destroy" ]; then
            expected="destroy ${env}"
            if [ "${INPUT_CONFIRMATION:-}" != "${expected}" ]; then
              echo "::error::destroy requires confirmation input to be exactly \"${expected}\" (got: \"${INPUT_CONFIRMATION:-}\")"
              exit 1
            fi
            echo "::warning::Destroy confirmed for ${env} — the EKS cluster and its VPC will be removed."
          fi

          # apply and destroy both run the apply job downstream (they apply different plan artifacts).
          case "${action}" in
            apply|destroy) run_apply=true ;;
            *)             run_apply=false ;;
          esac

          echo "::group::Resolved configuration"
          echo "Trigger:     ${EVENT}"
          echo "Environment: ${env}"
          echo "Action:      ${action}"
          echo "Var file:    environments/${env}.tfvars"
          echo "Run apply:   ${run_apply}"
          echo "::endgroup::"
          echo "::notice title=Terraform run::env=${env} action=${action} (trigger=${EVENT})"

          {
            echo "### Terraform run configuration"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Trigger | \`${EVENT}\` |"
            echo "| Environment | \`${env}\` |"
            echo "| Action | \`${action}\` |"
            echo "| Var file | \`environments/${env}.tfvars\` |"
            echo "| Run apply | \`${run_apply}\` |"
          } >> "${GITHUB_STEP_SUMMARY}"

          echo "environment=${env}"                  >> "${GITHUB_OUTPUT}"
          echo "action=${action}"                    >> "${GITHUB_OUTPUT}"
          echo "tfvars=environments/${env}.tfvars"   >> "${GITHUB_OUTPUT}"
          echo "run-apply=${run_apply}"              >> "${GITHUB_OUTPUT}"

  # ────────────────────────────────────────────────────────────────────────────
  # Static checks: fmt + validate. Cheap, fails fast, runs in parallel with scan.
  # ────────────────────────────────────────────────────────────────────────────
  validate:
    name: Validate
    needs: config
    runs-on: ${{ vars.RUNNER_IMAGE || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: Terraform init (no backend)
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        run: terraform validate -no-color

  # ────────────────────────────────────────────────────────────────────────────
  # Security scan. Non-blocking by default; flip to `exit-code: 1` to enforce.
  # ────────────────────────────────────────────────────────────────────────────
  scan:
    name: Security scan
    needs: config
    runs-on: ${{ vars.RUNNER_IMAGE || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Install tfsec directly instead of depending on a third-party action tag.
      # Pin TFSEC_VERSION via repo variable to reproduce; defaults to latest.
      - name: Run tfsec
        continue-on-error: true
        env:
          TFSEC_VERSION: ${{ vars.TFSEC_VERSION || 'latest' }}
        run: |
          set -euo pipefail
          if [ "${TFSEC_VERSION}" = "latest" ]; then
            url="https://github.com/aquasecurity/tfsec/releases/latest/download/tfsec-linux-amd64"
          else
            url="https://github.com/aquasecurity/tfsec/releases/download/${TFSEC_VERSION}/tfsec-linux-amd64"
          fi
          curl -fsSL "${url}" -o /tmp/tfsec
          chmod +x /tmp/tfsec
          /tmp/tfsec --version
          /tmp/tfsec --soft-fail --format sarif --out tfsec.sarif .
          /tmp/tfsec --soft-fail .

      - name: Upload SARIF
        # Uploading to code scanning needs GitHub Advanced Security, which isn't
        # available on free private repos — the upload then fails with "Resource
        # not accessible by integration". Don't let that fail the whole run; the
        # tfsec findings still print in the job log above.
        continue-on-error: true
        if: always() && hashFiles('tfsec.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: tfsec.sarif

  # ────────────────────────────────────────────────────────────────────────────
  # Plan. Always runs. Uploads tfplan.binary for the apply job to consume.
  # ────────────────────────────────────────────────────────────────────────────
  plan:
    name: ${{ needs.config.outputs.action == 'destroy' && 'Plan destroy' || 'Plan' }} (${{ needs.config.outputs.environment }})
    needs: [config, validate]
    runs-on: ${{ vars.RUNNER_IMAGE || 'ubuntu-latest' }}
    timeout-minutes: 20
    environment: ${{ needs.config.outputs.environment }}
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Print plan context
        shell: bash
        env:
          ENVIRONMENT: ${{ needs.config.outputs.environment }}
          ACTION:      ${{ needs.config.outputs.action }}
          TFVARS:      ${{ needs.config.outputs.tfvars }}
          BUCKET:      ${{ vars.TF_STATE_BUCKET }}
          REGION:      ${{ vars.AWS_REGION }}
        run: |
          echo "::group::Plan context"
          echo "Environment: ${ENVIRONMENT}"
          echo "Action:      ${ACTION}"
          echo "Var file:    ${TFVARS}"
          echo "Workspace:   ${ENVIRONMENT}"
          echo "State:       s3://${BUCKET}/${ENVIRONMENT}/terraform.tfstate (${REGION})"
          echo "::endgroup::"

      - name: Terraform plan
        id: tf
        uses: ./.github/actions/terraform-deploy
        with:
          working-directory: .
          terraform-version: ${{ env.TERRAFORM_VERSION }}
          aws-region: ${{ vars.AWS_REGION }}
          aws-role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-role-session-name: gha-${{ github.run_id }}-plan
          action: plan
          destroy: ${{ needs.config.outputs.action == 'destroy' }}
          var-file: ${{ needs.config.outputs.tfvars }}
          workspace: ${{ needs.config.outputs.environment }}
          plan-artifact-name: tfplan-${{ needs.config.outputs.environment }}-${{ github.run_id }}
          backend-config: |
            bucket=${{ vars.TF_STATE_BUCKET }}
            key=${{ needs.config.outputs.environment }}/terraform.tfstate
            region=${{ vars.AWS_REGION }}
            dynamodb_table=${{ vars.TF_LOCK_TABLE }}
            encrypt=true

      - name: Plan summary
        if: always()
        shell: bash
        env:
          ENVIRONMENT: ${{ needs.config.outputs.environment }}
          ACTION:      ${{ needs.config.outputs.action }}
          EXITCODE:    ${{ steps.tf.outputs.plan-exitcode }}
          SUMMARY:     ${{ steps.tf.outputs.plan-summary }}
        run: |
          case "${EXITCODE:-?}" in
            0) status="No changes" ;;
            2) status="Changes detected" ;;
            *) status="Plan failed (exit ${EXITCODE:-?})" ;;
          esac
          {
            echo "### Terraform plan — \`${ENVIRONMENT}\` (${ACTION})"
            echo ""
            echo "- **Status:** ${status}"
            echo "- **Trigger:** \`${GITHUB_EVENT_NAME}\`"
            echo "- **Commit:** \`${GITHUB_SHA}\`"
            if [ -n "${SUMMARY:-}" ]; then
              echo ""
              echo '```'
              echo "${SUMMARY}"
              echo '```'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "::notice title=Terraform plan::${ENVIRONMENT} (${ACTION}) — ${status}"

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          ENVIRONMENT: ${{ needs.config.outputs.environment }}
          EXITCODE:    ${{ steps.tf.outputs.plan-exitcode }}
          SUMMARY:     ${{ steps.tf.outputs.plan-summary }}
          PLAN_STDOUT: ${{ steps.tf.outputs.plan-stdout }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const env = process.env.ENVIRONMENT;
            const code = process.env.EXITCODE;
            const summary = process.env.SUMMARY || '(no summary)';
            const body = [
              `### Terraform plan — \`${env}\``,
              '',
              code === '0' ? '**No changes.**'
                : code === '2' ? '**Changes detected.**'
                : '**Plan failed.**',
              '',
              '```',
              summary.trim(),
              '```',
              '',
              '<details><summary>Full plan output</summary>',
              '',
              '```terraform',
              (process.env.PLAN_STDOUT || '').slice(0, 55000),
              '```',
              '</details>',
              '',
              `_Run: [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) • commit \`${context.sha.slice(0,7)}\`_`,
            ].join('\n');

            // Upsert: find a previous comment from this workflow for this env and edit it,
            // otherwise create a new one. Keeps the PR clean across repeated pushes.
            const marker = `<!-- terraform-plan:${env} -->`;
            const bodyWithMarker = `${marker}\n${body}`;
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body && c.body.startsWith(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: bodyWithMarker,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: bodyWithMarker,
              });
            }

  # ────────────────────────────────────────────────────────────────────────────
  # Apply. Gated by `needs.config.outputs.run-apply`. Pulls the *exact* plan
  # produced by the plan job — no re-plan, no drift between preview and apply.
  # ────────────────────────────────────────────────────────────────────────────
  apply:
    name: ${{ needs.config.outputs.action == 'destroy' && 'Destroy' || 'Apply' }} (${{ needs.config.outputs.environment }})
    needs: [config, validate, plan]
    if: needs.config.outputs.run-apply == 'true'
    runs-on: ${{ vars.RUNNER_IMAGE || 'ubuntu-latest' }}
    timeout-minutes: 60
    environment: ${{ needs.config.outputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Print apply context
        shell: bash
        env:
          ENVIRONMENT: ${{ needs.config.outputs.environment }}
          ACTION:      ${{ needs.config.outputs.action }}
          TFVARS:      ${{ needs.config.outputs.tfvars }}
          BUCKET:      ${{ vars.TF_STATE_BUCKET }}
          REGION:      ${{ vars.AWS_REGION }}
        run: |
          echo "::group::Apply context"
          echo "Environment:  ${ENVIRONMENT}"
          echo "Action:       ${ACTION}"
          echo "Var file:     ${TFVARS}"
          echo "Workspace:    ${ENVIRONMENT}"
          echo "Plan artifact: tfplan-${ENVIRONMENT}-${GITHUB_RUN_ID}"
          echo "State:        s3://${BUCKET}/${ENVIRONMENT}/terraform.tfstate (${REGION})"
          echo "::endgroup::"

      - name: Terraform apply
        id: tf
        uses: ./.github/actions/terraform-deploy
        with:
          working-directory: .
          terraform-version: ${{ env.TERRAFORM_VERSION }}
          aws-region: ${{ vars.AWS_REGION }}
          aws-role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-role-session-name: gha-${{ github.run_id }}-apply
          action: apply
          destroy: ${{ needs.config.outputs.action == 'destroy' }}
          var-file: ${{ needs.config.outputs.tfvars }}
          workspace: ${{ needs.config.outputs.environment }}
          download-plan-artifact: tfplan-${{ needs.config.outputs.environment }}-${{ github.run_id }}
          backend-config: |
            bucket=${{ vars.TF_STATE_BUCKET }}
            key=${{ needs.config.outputs.environment }}/terraform.tfstate
            region=${{ vars.AWS_REGION }}
            dynamodb_table=${{ vars.TF_LOCK_TABLE }}
            encrypt=true

      - name: Apply summary
        if: always()
        shell: bash
        env:
          ENVIRONMENT: ${{ needs.config.outputs.environment }}
          ACTION:      ${{ needs.config.outputs.action }}
          OUTCOME:     ${{ steps.tf.outcome }}
        run: |
          {
            echo "### Terraform ${ACTION} — \`${ENVIRONMENT}\`"
            echo ""
            echo "- **Outcome:** \`${OUTCOME}\`"
            echo "- **Trigger:** \`${GITHUB_EVENT_NAME}\`"
            echo "- **Commit:** \`${GITHUB_SHA}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "::notice title=Terraform ${ACTION}::${ENVIRONMENT} — ${OUTCOME}"

  # ────────────────────────────────────────────────────────────────────────────
  # Trigger the app repo's deploy workflow after a successful `apply` on the
  # shared cluster (environment = platform). The app repo's deploy.yml has a
  # `repository_dispatch: types: [deploy-app]` listener that auto-applies to
  # the dev namespace; qa/staging/prod still go through manual workflow_dispatch
  # with required reviewers.
  #
  # Required repo configuration:
  #   * Variable APP_REPO        — "owner/name" of the app repo (e.g. luniemma/codeplex-application-ai-systhem)
  #   * Secret   APP_REPO_TOKEN  — fine-grained PAT scoped to APP_REPO with `contents: write`
  #                                (or a GitHub App token mintable for that repo)
  # If either is unset the job no-ops with a clear notice instead of failing.
  # ────────────────────────────────────────────────────────────────────────────
  trigger_app_deploy:
    name: Trigger app deploy (dev)
    needs: [config, apply]
    if: |
      needs.config.outputs.run-apply == 'true' &&
      needs.config.outputs.action == 'apply' &&
      needs.config.outputs.environment == 'platform'
    runs-on: ${{ vars.RUNNER_IMAGE || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Dispatch deploy-app to ${{ vars.APP_REPO }}
        shell: bash
        env:
          APP_REPO:   ${{ vars.APP_REPO }}
          APP_TOKEN:  ${{ secrets.APP_REPO_TOKEN }}
          INFRA_RUN:  ${{ github.run_id }}
          INFRA_REPO: ${{ github.repository }}
          ACTOR:      ${{ github.actor }}
        run: |
          set -euo pipefail
          if [[ -z "${APP_REPO:-}" || -z "${APP_TOKEN:-}" ]]; then
            echo "::notice::APP_REPO variable or APP_REPO_TOKEN secret unset — skipping app dispatch."
            echo "::notice::Set repo Variable APP_REPO=<owner/name> and Secret APP_REPO_TOKEN=<PAT> to enable."
            exit 0
          fi

          payload=$(jq -nc \
            --arg env "dev" \
            --arg method "helm" \
            --arg by "$ACTOR" \
            --arg from "$INFRA_REPO" \
            --arg run "$INFRA_RUN" \
            --arg url "${GITHUB_SERVER_URL}/${INFRA_REPO}/actions/runs/${INFRA_RUN}" \
            '{event_type:"deploy-app", client_payload:{environment:$env, method:$method, triggered_by:$by, triggered_from:$from, infrastructure_run:$run, infrastructure_run_url:$url}}')

          http=$(curl -sS -o /tmp/resp -w '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${APP_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${APP_REPO}/dispatches" \
            -d "$payload")

          if [[ "$http" != "204" ]]; then
            echo "::error::repository_dispatch to ${APP_REPO} failed (HTTP $http)"
            cat /tmp/resp || true
            exit 1
          fi
          echo "::notice title=App deploy dispatched::${APP_REPO} (deploy-app → dev)"
          {
            echo "### App deploy dispatched"
            echo ""
            echo "- **Repo:** \`${APP_REPO}\`"
            echo "- **Event:** \`deploy-app\` → environment \`dev\`"
            echo "- **Triggered by infra run:** [${INFRA_RUN}](${GITHUB_SERVER_URL}/${INFRA_REPO}/actions/runs/${INFRA_RUN})"
          } >> "${GITHUB_STEP_SUMMARY}"
